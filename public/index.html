<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#E2136E" />
    <meta
      name="description"
      content="Yo Wallet — track money in, money out, and what your till looks like, right from your phone."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded async (media=print -> media=all) so a slow/blocked font CDN
         never delays first paint; display=swap shows fallback text meanwhile. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Yo Wallet - Your Personal Finance Tracker</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // If the app shell loads but React never mounts (e.g. this HTML was
      // opened as a static file), show a short "how to run" message instead
      // of a blank white page.
      window.addEventListener("load", function () {
        var tries = 0;
        var timer = setInterval(function () {
          var root = document.getElementById("root");
          if (root && root.firstElementChild) {
            clearInterval(timer);
            return;
          }
          tries += 1;
          if (tries > 12) {
            clearInterval(timer);
            var rootNode = document.getElementById("root");
            if (rootNode && !rootNode.firstElementChild) {
              var el = document.createElement("div");
              el.style.cssText =
                "font-family:-apple-system,'Segoe UI',system-ui,sans-serif;max-width:520px;margin:4rem auto;padding:0 1.5rem;color:#1B1712;";
              el.innerHTML =
                "<p style='font-weight:700;font-size:1.15rem;margin-bottom:.5rem;'>Yo Wallet didn\u2019t start.</p>" +
                "<p style='color:#6B655A;line-height:1.55;margin:0;'>This HTML is the app shell and looks empty on its own. " +
                "Run <code>npm start</code> and open the printed URL (usually <code>http://localhost:3000</code>), " +
                "or serve the compiled <code>build</code> folder.</p>";
              rootNode.appendChild(el);
            }
          }
        }, 500);
      });
    </script>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
